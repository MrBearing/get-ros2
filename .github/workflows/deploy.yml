name: Deploy installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'release' &&
       !github.event.release.draft && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
      release_id: ${{ steps.check.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the release and CI for its tagged commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
          EXPECTED_RELEASE_ID: ${{ github.event.release.id || '' }}
        run: bash .github/scripts/verify-release.sh

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the verification script from this workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: deployment-workflow
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - name: Prepare the tested files
        run: |
          mkdir _site
          cp release-source/install.sh release-source/README.md release-source/LICENSE _site/
          touch _site/.nojekyll
          cd _site
          sha256sum install.sh > install.sh.sha256
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Recheck the release, tag and CI immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
          EXPECTED_RELEASE_ID: ${{ needs.gate.outputs.release_id }}
        run: bash deployment-workflow/.github/scripts/verify-release.sh
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  check-published:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start the three independent published-installer workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for workflow in published-ubuntu-22-04.yml published-ubuntu-24-04.yml published-ubuntu-26-04.yml; do
            gh api --method POST "repos/$REPOSITORY/actions/workflows/$workflow/dispatches" -f ref=main
          done
