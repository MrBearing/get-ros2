name: Published Ubuntu 24.04

on:
  schedule:
    - cron: '21 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check-ubuntu.yml
    with:
      ubuntu: '24.04'
      source: published
